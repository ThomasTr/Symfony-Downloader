mercure:
    hubs:
        default:
            url: '%env(MERCURE_URL)%'
            public_url: '%env(MERCURE_PUBLIC_URL)%'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
                # Mercure 1.0 (RFC 9068): "iss" muss dem issuer-Block im
                # Caddyfile entsprechen, darum dieselbe Env-Variable.
                claims:
                    iss: '%env(MERCURE_TRUSTED_ISSUERS)%'
                    sub: sfdownloader
                    client_id: sfdownloader
